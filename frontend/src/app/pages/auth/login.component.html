<main class="login-page"><section class="login-card"><a class="login-brand" routerLink="/"><span class="brand-mark">E</span><div><strong>Employee Portal</strong><small>YOUR WORKSPACE, IN ONE PLACE</small></div></a><p class="eyebrow">WELCOME BACK</p><h1>Sign in to your account</h1><p class="login-subtitle">Enter your credentials to access your workspace.</p><form (ngSubmit)="submit()"><label>Username<input name="username" [(ngModel)]="username" autocomplete="username" required placeholder="Your username"></label><label>Password<input name="password" [(ngModel)]="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><p class="form-error">{{error}}</p><button class="button button-primary full-button" [disabled]="busy">{{busy ? 'Signing in...' : 'Sign in'}} </button></form><p class="login-note">Secure access for your employee workspace</p><div class="setup-divider">FIRST TIME HERE? SET UP YOUR WORKSPACE</div><div class="setup-actions"><a class="button button-secondary" routerLink="/setup/employees"> Add your first employee</a><a class="button button-secondary" routerLink="/setup/roles"> Create a role</a><a class="button button-secondary" routerLink="/setup/tasks"> Create a task</a></div></section></main>
