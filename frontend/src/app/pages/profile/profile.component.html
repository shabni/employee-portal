<div class="welcome-row"><div><p class="eyebrow">YOUR ACCOUNT</p><h1>My profile</h1><p class="subheading">Manage your personal and work information.</p></div></div><div class="notice" *ngIf="message">{{message}}</div><section class="panel form-panel narrow-form"><div class="profile-header"><div class="profile-photo"><img *ngIf="profile.profileImage" [src]="'http://localhost:3000/api/uploads/getImage/profile/'+profile.profileImage" alt="Profile"><span *ngIf="!profile.profileImage">{{profile.firstName?.[0]}}{{profile.lastName?.[0]}}</span></div><div><h2>{{profile.firstName}} {{profile.lastName}}</h2><p>{{profile.designation || 'Employee'}}  |  {{profile.officeEmail || profile.username}}</p><label class="button button-secondary file-button">Upload photo<input type="file" accept="image/*" (change)="upload($event)"></label></div></div><form (ngSubmit)="save()"><div class="form-grid"><label>First name<input [(ngModel)]="profile.firstName" name="firstName" required></label><label>Last name<input [(ngModel)]="profile.lastName" name="lastName"></label><label>Username<input [(ngModel)]="profile.username" name="username" disabled></label><label>Office email<input [(ngModel)]="profile.officeEmail" name="officeEmail" type="email"></label><label>Phone<input [(ngModel)]="profile.phoneNumber" name="phoneNumber"></label><label>National ID<input [(ngModel)]="profile.nationalId" name="nationalId"></label><label>Designation<input [(ngModel)]="profile.designation" name="designation"></label><label>Joining date<input [(ngModel)]="profile.joiningDate" name="joiningDate" type="date"></label><label class="span-2">Address<textarea [(ngModel)]="profile.address" name="address" rows="3"></textarea></label></div><div class="form-actions"><button class="button button-primary" [disabled]="busy">{{busy?'Saving...':'Save changes'}}</button></div></form></section>
